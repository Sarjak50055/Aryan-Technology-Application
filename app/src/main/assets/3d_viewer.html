<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lift 3D Viewer - Detailed</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    </style>
</head>
<body>
    <!-- Import Three.js and OrbitControls -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js" type="module"></script>
    
    <script type="module">
        import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls, liftGroup, mixer, clock;

        const textureColors = {
            'metal': { color: 0x888888, roughness: 0.3, metalness: 0.8 },
            'glass': { color: 0xadd8e6, transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.1 },
            'wood':  { color: 0x8b5a2b, roughness: 0.8, metalness: 0.1 }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3); // Adjust camera position for typical model scale

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = true;
            controls.enableZoom = true;
            controls.target.set(0, 1, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(2, 5, 5);
            scene.add(dirLight);

            clock = new THREE.Clock();

            // Load GLB model
            const loader = new GLTFLoader();
            loader.load(
                'simple-elevator-with-animation/source/ElevatorAnimation.glb',
                function (gltf) {
                    liftGroup = gltf.scene;
                    
                    // Center and scale model slightly if necessary
                    // liftGroup.scale.set(0.5, 0.5, 0.5); 
                    
                    scene.add(liftGroup);

                    // Setup animation if the model has one
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(liftGroup);
                        const action = mixer.clipAction(gltf.animations[0]);
                        action.play();
                    }
                },
                function (xhr) {
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function (error) {
                    console.error('An error happened loading GLTF:', error);
                }
            );

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            
            if (mixer) {
                mixer.update(clock.getDelta());
            }

            renderer.render(scene, camera);
        }

        // --- Bridge Functions for Android ---

        window.rotateCamera = function(deltaX, deltaY) {
            if (liftGroup) {
                const maxAngle = Math.PI;
                liftGroup.rotation.y = deltaX * maxAngle;
                // Avoid rotating on X too much for models, it causes them to flip
            }
        };

        window.updateTexture = function(wallName, textureName) {
            if (!liftGroup) return;

            const textureConfig = textureColors[textureName.toLowerCase()];
            if (!textureConfig) return;

            // Traverse the loaded model and apply the texture to all meshes for now
            // since we don't know the exact mesh names for "front/left/right" in the provided model
            liftGroup.traverse(function(child) {
                if (child.isMesh) {
                    // Create a new material to avoid modifying shared materials incorrectly
                    child.material = new THREE.MeshStandardMaterial({
                        color: textureConfig.color,
                        roughness: textureConfig.roughness,
                        metalness: textureConfig.metalness,
                        transparent: textureConfig.transparent || false,
                        opacity: textureConfig.opacity || 1.0,
                        side: THREE.DoubleSide // Ensure it's visible from inside/outside
                    });
                }
            });
        };

        init();
    </script>
</body>
</html>
