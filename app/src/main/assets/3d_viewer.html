<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lift 3D Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #2C2C2C; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- Import Three.js from unpkg for simplicity -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script>
        let scene, camera, renderer, liftBox;
        
        // Map wall names to BoxGeometry face indices
        // BoxGeometry face order: right (0), left (1), top (2), bottom (3), front (4), back (5)
        const wallIndices = {
            'right': 0,
            'left': 1,
            'top': 2,
            'bottom': 3,
            'front': 4,
            'back': 5
        };

        const textureColors = {
            'metal': { color: 0x888888, roughness: 0.2, metalness: 0.8 },
            'glass': { color: 0xadd8e6, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.1 },
            'wood':  { color: 0x8b5a2b, roughness: 0.8, metalness: 0.1 }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2C2C2C);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0); // Camera is inside the lift

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1, 10);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Create Lift Box
            // Dimensions of a typical lift (e.g., 2m x 2.5m x 2m)
            const geometry = new THREE.BoxGeometry(2, 2.5, 2);
            
            // Reverse the normals so we can see the inside of the box
            geometry.scale(-1, -1, -1);

            // Create 6 default materials (all metal initially)
            const materials = [];
            for (let i = 0; i < 6; i++) {
                materials.push(new THREE.MeshStandardMaterial({
                    color: textureColors['metal'].color,
                    roughness: textureColors['metal'].roughness,
                    metalness: textureColors['metal'].metalness,
                    side: THREE.BackSide // Render on the inside
                }));
            }

            liftBox = new THREE.Mesh(geometry, materials);
            scene.add(liftBox);

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Target rotation variables (controlled by joystick)
        let targetRotationX = 0;
        let targetRotationY = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            // Smoothly interpolate current rotation to target rotation
            camera.rotation.x += (targetRotationY - camera.rotation.x) * 0.1;
            camera.rotation.y += (targetRotationX - camera.rotation.y) * 0.1;

            renderer.render(scene, camera);
        }

        // --- Functions called by Android Java ---

        // deltaX, deltaY range from -1.0 to 1.0
        window.rotateCamera = function(deltaX, deltaY) {
            // Max rotation angle (e.g., PI/2 for looking around)
            const maxAngleX = Math.PI / 1.5;
            const maxAngleY = Math.PI / 2.2;
            
            // Inverse Y because joystick down means look down (which is negative rotation X)
            targetRotationX = -deltaX * maxAngleX;
            targetRotationY = deltaY * maxAngleY;
        };

        window.updateTexture = function(wallName, textureName) {
            const faceIndex = wallIndices[wallName.toLowerCase()];
            const textureConfig = textureColors[textureName.toLowerCase()];
            
            if (faceIndex !== undefined && textureConfig) {
                const material = liftBox.material[faceIndex];
                material.color.setHex(textureConfig.color);
                material.roughness = textureConfig.roughness;
                material.metalness = textureConfig.metalness;
                
                if (textureConfig.transparent) {
                    material.transparent = true;
                    material.opacity = textureConfig.opacity;
                } else {
                    material.transparent = false;
                    material.opacity = 1.0;
                }
                material.needsUpdate = true;
            }
        };

        // Start Three.js scene
        init();
    </script>
</body>
</html>
